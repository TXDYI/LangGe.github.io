spring:
  redis:
    host: localhost
    port: 6379
    timeout: 5000
  application:
    name: ZeiNengJie
  datasource:
    url: jdbc:mysql://localhost:3306/zeinengjie?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
    username:  # 数据库用户名
    password:  # 数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource  # 指定 Druid 作为数据源
    druid:
      initial-size: 5    # 初始连接数
      min-idle: 5        # 最小空闲连接数
      max-active: 20     # 最大连接数
      max-wait: 60000    # 最大等待时间（毫秒）
      pool-prepared-statements: true  # 开启PSCache
      max-pool-prepared-statement-per-connection-size: 20
      validation-query: SELECT 1 FROM DUAL  # 连接检测SQL
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000


mybatis:
  mapper-locations: classpath:mapper/*.xml  # 指定 Mapper XML 位置
  type-aliases-package: com.example.zeinengjie.pojo  # 指定实体类包路径
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰命名自动映射（数据库字段 user_name → Java 属性 userName）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
server:
  port: 8081
  tomcat:
    uri-encoding: utf-8
jwt:
  secret: obtQprow4bFiQRZbmfuRu5Kd1996Zwb3OmeBfwuMRho=

oss:
  endpoint: # 阿里云 OSS 存储服务
  access-key-id:  # 阿里云 OSS 密钥
  access-key-secret:  # 阿里云 OSS 密钥
  bucket-name:  # 阿里云 OSS 存储空间
mail:
  host: smtp.qq.com
  transport:
    protocol: smtp
  smtp:
    auth: true
    ssl:
      enable: true
      protocols: TLSv1.2
qq:
  qq-id:   # QQ 邮箱
  qq-password:  # QQ 邮箱授权码

springdoc:
  api-docs:
    enabled: true   # 是否启用 OpenAPI 文档
    path: /v3/api-docs # API 文档 JSON 地址（默认 /v3/api-docs）
  swagger-ui:
    enabled: true   # 是否启用 Swagger UI
    path: /swagger-ui.html  # Swagger UI 访问地址
    operations-sorter: alpha # 按字母排序接口
    tags-sorter: alpha # 按字母排序标签
    tryItOutEnabled: true # 允许在 Swagger UI 中尝试 API
  show-actuator: true  # 显示 Spring Boot Actuator 端点（如果有）

