<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>超级无敌屌炸天</title>

    <style>
        /* ===== 动态背景 ===== */
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at center, #0a0f29, #000);
            height: 100vh;
            color: white;
        }

        /* 星空背景粒子 */
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: transparent url('https://i.postimg.cc/CLXp6V2v/stars.png') repeat;
            animation: animateStars 60s linear infinite;
        }

        @keyframes animateStars {
            from {
                background-position: 0 0;
            }
            to {
                background-position: -2000px 2000px;
            }
        }

        /* ===== 内容容器 ===== */
        .container {
            text-align: center;
            margin-top: 150px;
        }

        /* ===== 霓虹标题 ===== */
        h1 {
            font-size: 60px;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 12px #00eaff, 0 0 25px #00eaff;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 8px #00eaff, 0 0 15px #00eaff;
            }
            to {
                text-shadow: 0 0 18px #00ffff, 0 0 35px #00ffff;
            }
        }

        /* ===== 介绍文字 ===== */
        .subtitle {
            font-size: 22px;
            opacity: 0.8;
            margin-top: 10px;
        }

        /* ===== 玻璃拟态卡片 ===== */
        /* 让卡片的内容垂直排列 */
            .card {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            
            /* 图片容器 */
            .img-box {
                width: 100%;
                height: 220px;
                border-radius: 15px;
                overflow: hidden;
                transform-style: preserve-3d;
                transition: transform 0.8s ease;
            }
            
            /* 图片本体 */
            .img-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            
            /* 悬停旋转效果 */
            .card:hover .img-box {
                transform: perspective(600px) rotateY(15deg) rotateX(6deg) scale(1.04);
            }
            
            /* 文字介绍区域 */
            .info {
                text-align: center;
                margin-top: 20px;
            }
            
            .info h3 {
                margin: 0;
                font-size: 22px;
            }
            
            .info p {
                margin-top: 10px;
                font-size: 16px;
                opacity: 0.9;
            }


        /* ===== 霓虹按钮 ===== */
        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(120deg, #00eaff, #007bff);
            border-radius: 30px;
            color: black;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 20px;
            box-shadow: 0 0 15px #00eaff;
            transition: 0.3s;
        }

        .btn:hover {
            box-shadow: 0 0 25px #00ffff;
            transform: scale(1.08);
        }

        /* ===== 底部版权 ===== */
        footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <div class="container">
        <h1>LangGe</h1>
        <p class="subtitle">欢迎来到你的专属酷炫 GitHub 首页</p>

       <div class="card">
            <div class="img-box">
                <img src="https://i.postimg.cc/XqGQS1gF/sample.jpg" alt="图片" />
            </div>

            <div class="info">
                <h3>图片标题</h3>
                <p>这是图片的介绍文字，可以写内容说明或超链接介绍。</p>
            </div>
    </div>
    </div>

    <footer>© 2025 ZeiNengJie · All Rights Reserved</footer>

</body>
</html>
