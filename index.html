<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeiNengJie – 首页</title>

    <style>
        /* ===== 动态背景 ===== */
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at center, #0a0f29, #000);
            height: 100vh;
            color: white;
        }

        /* 星空背景粒子 */
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: transparent url('https://i.postimg.cc/CLXp6V2v/stars.png') repeat;
            animation: animateStars 60s linear infinite;
        }

        @keyframes animateStars {
            from {
                background-position: 0 0;
            }
            to {
                background-position: -2000px 2000px;
            }
        }

        /* ===== 内容容器 ===== */
        .container {
            text-align: center;
            margin-top: 150px;
        }

        /* ===== 霓虹标题 ===== */
        h1 {
            font-size: 60px;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 12px #00eaff, 0 0 25px #00eaff;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 8px #00eaff, 0 0 15px #00eaff;
            }
            to {
                text-shadow: 0 0 18px #00ffff, 0 0 35px #00ffff;
            }
        }

        /* ===== 介绍文字 ===== */
        .subtitle {
            font-size: 22px;
            opacity: 0.8;
            margin-top: 10px;
        }

        /* ===== 玻璃拟态卡片 ===== */
        .card {
            width: 320px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 0 25px rgba(0,255,255,0.2);
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 35px rgba(0,255,255,0.4);
        }

        /* ===== 霓虹按钮 ===== */
        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(120deg, #00eaff, #007bff);
            border-radius: 30px;
            color: black;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 20px;
            box-shadow: 0 0 15px #00eaff;
            transition: 0.3s;
        }

        .btn:hover {
            box-shadow: 0 0 25px #00ffff;
            transform: scale(1.08);
        }

        /* ===== 底部版权 ===== */
        footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <div class="container">
        <h1>贼能借 ZeiNengJie</h1>
        <p class="subtitle">欢迎来到你的专属酷炫 GitHub 首页</p>

        <div class="card">
            <h2>🔥 关于本站</h2>
            <p>
                一个由 Vue + SpringBoot + 创意构建的项目集散地。  
                持续更新中……
            </p>
            <a href="https://github.com/" class="btn">进入 GitHub</a>
        </div>
    </div>

    <footer>© 2025 ZeiNengJie · All Rights Reserved</footer>

</body>
</html>
